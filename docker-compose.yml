services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opendriver-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SQLCMD=/opt/mssql-tools18/bin/sqlcmd; [ -x $$SQLCMD ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd; $$SQLCMD -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    restart: unless-stopped

  api:
    build:
      context: ${OPEN_DRIVER_APP_DIR}
      dockerfile: apps/api/Dockerfile
    container_name: opendriver-api
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
    expose:
      - "3001"
    restart: unless-stopped

  web:
    build:
      context: ${OPEN_DRIVER_APP_DIR}
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    container_name: opendriver-web
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: opendriver-nginx
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/opendriver.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  sqlserver-data:
