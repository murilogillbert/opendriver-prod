services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opendriverhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SQLCMD=/opt/mssql-tools18/bin/sqlcmd; [ -x $$SQLCMD ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd; $$SQLCMD -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    restart: unless-stopped

  api:
    build:
      context: ${HUB_APP_DIR}
      dockerfile: backend/Dockerfile
    container_name: opendriverhub-api
    env_file:
      - .env
    environment:
      # Connection string montada aqui (compose interpola ${...} a partir do .env).
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${SQLSERVER_DATABASE:-OpenDriverHub};User Id=sa;Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - api-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ${HUB_APP_DIR}
      dockerfile: web.Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
    container_name: opendriverhub-web
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: opendriverhub-nginx
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/hub.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  sqlserver-data:
  api-uploads:
